name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: src/ compiles with the oldest supported TypeScript
        run: npx --yes -p typescript@5.0 tsc -p tsconfig.strict.json
      - run: npm run format:check
      - run: npm test
      - run: npm run build:demo
