<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cytoscape-libavoid Demo</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          14px system-ui,
          sans-serif;
        background: #fafafa;
        color: #222;
      }
      /* the header grows to as many lines as it wraps to, the graph takes the rest */
      body {
        display: flex;
        flex-direction: column;
      }
      #cy {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      header {
        min-height: 48px;
        display: flex;
        gap: 6px 16px;
        align-items: center;
        padding: 6px 16px;
        box-sizing: border-box;
        border-bottom: 1px solid #ddd;
        background: #fff;
        flex-wrap: wrap;
      }
      header label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #stats {
        margin-left: auto;
        color: #666;
        font-variant-numeric: tabular-nums;
      }
      #optionsDialog {
        width: min(860px, 90vw);
        max-height: 85vh;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 16px 20px;
      }
      #optionsDialog::backdrop {
        background: rgb(0 0 0 / 30%);
      }
      #optionsDialog h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      #optionsDialog h3 {
        margin: 16px 0 6px;
        font-size: 14px;
      }
      #optionsDialog small {
        font-weight: normal;
        color: #666;
      }
      #optionsDialog pre,
      #optionsDialog td {
        font:
          12px ui-monospace,
          monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #optionsDialog pre {
        margin: 0;
        padding: 8px 10px;
        background: #f3f3f3;
        border-radius: 4px;
      }
      #optionsDialog table {
        width: 100%;
        border-collapse: collapse;
      }
      #optionsDialog th {
        text-align: left;
        border-bottom: 1px solid #ccc;
      }
      #optionsDialog td {
        padding: 3px 8px 3px 0;
        border-bottom: 1px solid #eee;
        vertical-align: top;
      }
      #optionsDialog tr.changed td {
        background: #fff3d6;
        font-weight: 600;
      }
      #optionsDialog form > button {
        margin-top: 16px;
        float: right;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>cytoscape-libavoid</strong>
      <label title="Lädt die Seite neu. Stahlwerk: Doppelklick auf eine Gruppe klappt sie ein oder aus"
        >Graph
        <select id="graph">
          <option value="small">Beispiel</option>
          <option value="plant">Stahlwerk</option>
          <option value="tw">Stahlwerk: TW-Ausschnitt</option>
        </select></label
      >
      <label><input id="rerouteOnDrag" type="checkbox" checked /> beim Ziehen routen</label>
      <label title="Erst routen, wenn der gezogene Knoten so lange ruht (0 = aus); beim Loslassen wird sofort geroutet"
        >Verzögerung
        <input id="dragRouteDelay" type="number" min="0" step="100" value="600" style="width: 5em" /> ms</label
      >
      <label title="Kanten gezogener Knoten ausblenden, bis sie neu geroutet sind"
        ><input id="hideEdgesOnDrag" type="checkbox" checked /> Kanten beim Ziehen ausblenden</label
      >
      <label title="Beschriftung auf das längste Segment statt in die Mitte"
        ><input id="labelPosition" type="checkbox" checked /> Label auf längstem Segment</label
      >
      <label title="Routing in einem Web Worker (lädt die Seite neu)"
        ><input id="worker" type="checkbox" /> Worker</label
      >
      <button id="showOptions" type="button" title="Wie das Plugin geladen wurde und welche Optionen gelten">
        Plugin-Optionen
      </button>
      <span id="stats"></span>
    </header>
    <div id="cy"></div>

    <dialog id="optionsDialog">
      <form method="dialog">
        <h2>Plugin-Optionen</h2>
        <h3>libavoid geladen</h3>
        <p id="optionsLoad"></p>
        <h3>Aufruf in demo/main.ts</h3>
        <pre id="optionsCall"></pre>
        <h3>Optionen in Gebrauch <small>(hervorgehoben: abweichend vom Default)</small></h3>
        <table>
          <thead>
            <tr><th>Option</th><th>Wert</th><th>Default</th></tr>
          </thead>
          <tbody id="optionsRows"></tbody>
        </table>
        <button>Schließen</button>
      </form>
    </dialog>

    <!-- built from main.ts by `npm run build:demo` -->
    <script type="module" src="build/main.js"></script>
  </body>
</html>
